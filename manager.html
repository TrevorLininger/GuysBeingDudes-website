<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GBD Fantasy Football - Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="history.html">League History</a>
                <a href="managers.html">Managers</a>
                <a href="rivalries.html">Rivalries</a>
                <a href="records.html">Records</a>
            </div>

        </nav>

        <a href="index.html">
            <img 
                src="images/gbd-logo2.png" 
                alt="GBD Fantasy Football Logo"
                class="league-logo-page"
            >
        </a>

    </header>

    <main id="manager-profile">

    <section class="manager-profile-header">

        <img
            id="manager-image"
            src=""
            alt=""
            class="manager-profile-image"
        >

        <div class="manager-profile-header-info">

            <h1 id="manager-name">Loading...</h1>

            <p id="manager-team"></p>

        </div>

    </section>


    <section class="manager-career-stats">

        <div class="career-stat-card">
            <h3>Championships</h3>
            <p id="championships">-</p>
        </div>

        <div class="career-stat-card">
            <h3>Career Record</h3>
            <p id="career-record">-</p>
        </div>

        <div class="career-stat-card">
            <h3>Best Season</h3>
            <p id="best-season">-</p>
        </div>

        <div class="career-stat-card">
            <h3>Career Points</h3>
            <p id="career-points">-</p>
        </div>

    </section>

</main>

    <script src="js/manager-stats-browser.js"></script>
    <script src="js/manager-profile.js"></script>

</body>

</html>
