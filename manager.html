<main id="manager-profile">

    <!-- Manager Header -->
    <section class="manager-profile-header">

        <div class="manager-profile-title">

            <p class="manager-profile-label">GUYS BEING DUDES</p>

            <h1 id="manager-name">Loading...</h1>

            <p id="manager-team"></p>

        </div>

    </section>


    <!-- Career Overview -->
    <section class="manager-overview">

        <div class="manager-stat-card manager-stat-card-highlight">
            <span class="manager-stat-label">CHAMPIONSHIPS</span>
            <span class="manager-stat-value" id="championships">-</span>
        </div>

        <div class="manager-stat-card">
            <span class="manager-stat-label">CAREER RECORD</span>
            <span class="manager-stat-value" id="career-record">-</span>
        </div>

        <div class="manager-stat-card">
            <span class="manager-stat-label">BEST SEASON</span>
            <span class="manager-stat-value" id="best-season">-</span>
        </div>

        <div class="manager-stat-card">
            <span class="manager-stat-label">CAREER POINTS</span>
            <span class="manager-stat-value" id="career-points">-</span>
        </div>

    </section>


    <!-- Career Highlights -->
    <section class="manager-section">

        <div class="manager-section-heading">

            <h2>Career Highlights</h2>

            <div class="manager-section-line"></div>

        </div>


        <div class="manager-highlights-grid">

            <div class="manager-highlight-card">

                <span class="manager-highlight-label">
                    HIGHEST SCORE
                </span>

                <strong id="highest-score">-</strong>

                <span id="highest-score-detail"></span>

            </div>


            <div class="manager-highlight-card">

                <span class="manager-highlight-label">
                    LOWEST SCORE
                </span>

                <strong id="lowest-score">-</strong>

                <span id="lowest-score-detail"></span>

            </div>


            <div class="manager-highlight-card">

                <span class="manager-highlight-label">
                    BIGGEST WIN
                </span>

                <strong id="biggest-win">-</strong>

                <span id="biggest-win-detail"></span>

            </div>


            <div class="manager-highlight-card">

                <span class="manager-highlight-label">
                    WORST LOSS
                </span>

                <strong id="worst-loss">-</strong>

                <span id="worst-loss-detail"></span>

            </div>

        </div>

    </section>


    <!-- Season History -->
    <section class="manager-section">

        <div class="manager-section-heading">

            <h2>Season History</h2>

            <div class="manager-section-line"></div>

        </div>


        <div class="manager-season-history" id="season-history">

            <!-- Seasons will be inserted here -->

        </div>

    </section>

</main>
